<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>布朗運動模擬實驗室</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for browser-side compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { user-select: none; }
        /* Custom scrollbar for data logger */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-gray-900 text-white">
    <div id="root"></div>

    <script type="text/babel" data-presets="typescript,react">
        // --- 1. Constants & Types ---
        
        // Types are implicitly handled by Babel TS preset, no need to declare interfaces in runtime code usually, 
        // but we can keep them for clarity since we are using the typescript preset.

        const DEFAULT_CONFIG = {
            soluteSize: 20,
            solventSize: 3,
            soluteCount: 3,
            solventCount: 150,
            temperature: 5,
            showTrails: true,
            trailLength: 200,
        };

        const COLORS = {
            SOLUTE: '#FDBA74', // Orange-300
            SOLVENT: '#60A5FA', // Blue-400
            BACKGROUND: '#111827', // Gray-900
            TRAIL: 'rgba(253, 186, 116, 0.3)',
        };

        const PHYSICS = {
            DAMPING: 1,
            MIN_SPEED: 0.5,
            MAX_INITIAL_SPEED_VARIANCE: 2,
        };

        // --- 2. Components ---
        const { useState, useEffect, useRef, useCallback } = React;

        // --- DataLogger Component ---
        const DataLogger = ({ records, onClear }) => {
            const downloadCSV = () => {
                if (records.length === 0) return;
                const BOM = '\uFEFF';
                const headers = ['紀錄時間', '溶質大小 (px)', '溶劑大小 (px)', '溫度 (速度)', '溶質數量', '溶劑數量', '軌跡長度'];
                const rows = records.map(record => [
                    record.timestamp, record.soluteSize, record.solventSize, 
                    record.temperature, record.soluteCount, record.solventCount, 
                    record.showTrails ? record.trailLength : '不顯示'
                ].join(','));
                const csvContent = BOM + [headers.join(','), ...rows].join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `布朗運動實驗紀錄_${new Date().toISOString().slice(0, 10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            if (records.length === 0) return null;

            return (
                <div className="mt-6 bg-gray-800 rounded-xl border border-gray-700 overflow-hidden shadow-lg animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div className="p-4 border-b border-gray-700 flex flex-wrap gap-4 items-center justify-between bg-gray-800/80">
                        <h3 className="font-bold text-white flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fillRule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clipRule="evenodd" />
                            </svg>
                            實驗數據紀錄 ({records.length})
                        </h3>
                        <div className="flex gap-2">
                            <button onClick={onClear} className="px-3 py-1.5 text-xs text-red-300 hover:text-red-200 hover:bg-red-900/30 rounded border border-red-900/50 transition-colors">清除紀錄</button>
                            <button onClick={downloadCSV} className="px-4 py-1.5 bg-green-600 hover:bg-green-500 text-white text-sm font-semibold rounded shadow-md flex items-center gap-2 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                                匯出 CSV
                            </button>
                        </div>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left text-gray-300">
                            <thead className="text-xs text-gray-400 uppercase bg-gray-900/50 border-b border-gray-700">
                                <tr>
                                    <th className="px-6 py-3 whitespace-nowrap">紀錄時間</th>
                                    <th className="px-6 py-3 whitespace-nowrap">溶質大小</th>
                                    <th className="px-6 py-3 whitespace-nowrap">溶劑大小</th>
                                    <th className="px-6 py-3 whitespace-nowrap">溫度</th>
                                    <th className="px-6 py-3 whitespace-nowrap">溶質數量</th>
                                    <th className="px-6 py-3 whitespace-nowrap">溶劑數量</th>
                                </tr>
                            </thead>
                            <tbody>
                                {records.map((record) => (
                                    <tr key={record.id} className="border-b border-gray-700 hover:bg-gray-700/50 transition-colors">
                                        <td className="px-6 py-3 font-mono text-gray-400">{record.timestamp}</td>
                                        <td className="px-6 py-3 text-orange-300 font-medium">{record.soluteSize}</td>
                                        <td className="px-6 py-3 text-blue-300 font-medium">{record.solventSize}</td>
                                        <td className="px-6 py-3 text-red-300 font-medium">{record.temperature}</td>
                                        <td className="px-6 py-3">{record.soluteCount}</td>
                                        <td className="px-6 py-3">{record.solventCount}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // --- ControlPanel Component ---
        const ControlPanel = ({ config, setConfig, onReset, onRecord, isPlaying, onTogglePause }) => {
            const handleChange = (key, value) => {
                setConfig((prev) => ({ ...prev, [key]: value }));
            };

            return (
                <div className="bg-gray-800 p-6 rounded-xl shadow-lg space-y-6 border border-gray-700">
                    <div className="flex items-center justify-between">
                        <h2 className="text-xl font-bold text-white flex items-center gap-2">
                             <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                            </svg>
                            參數設定
                        </h2>
                        <button
                            onClick={onTogglePause}
                            className={`px-3 py-1 rounded-lg text-xs font-bold transition-all shadow-lg flex items-center gap-1 ${isPlaying ? 'bg-amber-600/20 text-amber-500 border border-amber-600/50 hover:bg-amber-600 hover:text-white' : 'bg-green-600/20 text-green-500 border border-green-600/50 hover:bg-green-600 hover:text-white'}`}
                        >
                            {isPlaying ? (
                                <>
                                  <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                    <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd" />
                                  </svg>
                                  暫停
                                </>
                            ) : (
                                <>
                                  <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                    <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd" />
                                  </svg>
                                  繼續
                                </>
                            )}
                        </button>
                    </div>

                    <div className="space-y-2">
                        <div className="flex justify-between text-sm font-medium text-gray-300">
                            <label>溶質大小 (大粒子)</label>
                            <span className="text-orange-400">{config.soluteSize}px</span>
                        </div>
                        <input type="range" min="10" max="50" step="1" value={config.soluteSize} onChange={(e) => handleChange('soluteSize', parseInt(e.target.value))} className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-orange-500" />
                    </div>

                    <div className="space-y-2">
                        <div className="flex justify-between text-sm font-medium text-gray-300">
                            <label>溶劑大小 (小分子)</label>
                            <span className="text-blue-400">{config.solventSize}px</span>
                        </div>
                        <input type="range" min="2" max="8" step="1" value={config.solventSize} onChange={(e) => handleChange('solventSize', parseInt(e.target.value))} className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                    </div>

                    <div className="space-y-2">
                        <div className="flex justify-between text-sm font-medium text-gray-300">
                            <label>溫度 (分子運動速度)</label>
                            <span className="text-red-400">{config.temperature}</span>
                        </div>
                        <input type="range" min="1" max="20" step="1" value={config.temperature} onChange={(e) => handleChange('temperature', parseInt(e.target.value))} className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-red-500" />
                    </div>

                    <div className="space-y-2">
                        <div className="flex justify-between text-sm font-medium text-gray-300">
                            <label>溶質數量</label>
                            <span className="text-gray-100">{config.soluteCount}</span>
                        </div>
                        <input type="range" min="1" max="10" step="1" value={config.soluteCount} onChange={(e) => handleChange('soluteCount', parseInt(e.target.value))} className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-gray-500" />
                    </div>

                    <div className="space-y-2">
                        <div className="flex justify-between text-sm font-medium text-gray-300">
                            <label>溶劑數量</label>
                            <span className="text-gray-100">{config.solventCount}</span>
                        </div>
                        <input type="range" min="50" max="500" step="10" value={config.solventCount} onChange={(e) => handleChange('solventCount', parseInt(e.target.value))} className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-gray-500" />
                    </div>

                    <div className="pt-4 border-t border-gray-700 space-y-4">
                        <label className="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" className="accent-green-600 w-5 h-5" checked={config.showTrails} onChange={(e) => handleChange('showTrails', e.target.checked)} />
                            <span className="text-sm font-medium text-gray-300">顯示移動軌跡</span>
                        </label>
                        
                        {config.showTrails && (
                            <div className="space-y-2 pl-1">
                                <div className="flex justify-between text-sm font-medium text-gray-400">
                                    <label>軌跡長度</label>
                                    <span className="text-green-400">{config.trailLength}</span>
                                </div>
                                <input type="range" min="50" max="1000" step="50" value={config.trailLength} onChange={(e) => handleChange('trailLength', parseInt(e.target.value))} className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-green-500" />
                            </div>
                        )}
                    </div>

                    <div className="pt-4 border-t border-gray-700 space-y-3">
                        <button onClick={onRecord} className="w-full px-4 py-3 bg-gradient-to-r from-green-600 to-green-500 hover:from-green-500 hover:to-green-400 text-white rounded-lg text-sm font-bold shadow-lg shadow-green-900/50 transition-all transform active:scale-95 flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clipRule="evenodd" />
                            </svg>
                            紀錄當前數據 (確認)
                        </button>
                        <button onClick={onReset} className="w-full px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2">
                             <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                            重置所有設定
                        </button>
                    </div>
                </div>
            );
        };

        // --- SimulationCanvas Component ---
        const SimulationCanvas = ({ config, isPlaying }) => {
            const canvasRef = useRef(null);
            const particlesRef = useRef([]);
            const requestRef = useRef(0);
            const containerRef = useRef(null);
            const prevTempRef = useRef(config.temperature);

            const initParticles = useCallback(() => {
                if (!canvasRef.current) return;
                const { width, height } = canvasRef.current;
                const particles = [];
                let idCounter = 0;

                const createParticle = (type, count, size, baseSpeed, color) => {
                    for (let i = 0; i < count; i++) {
                        const padding = size + 2;
                        const x = Math.random() * (width - 2 * padding) + padding;
                        const y = Math.random() * (height - 2 * padding) + padding;
                        const angle = Math.random() * Math.PI * 2;
                        const mass = size * size;
                        particles.push({
                            id: idCounter++, x, y,
                            vx: Math.cos(angle) * baseSpeed * (Math.random() + 0.5),
                            vy: Math.sin(angle) * baseSpeed * (Math.random() + 0.5),
                            radius: size, mass, color, type, history: [],
                        });
                    }
                };
                createParticle('solute', config.soluteCount, config.soluteSize, config.temperature * 0.1, COLORS.SOLUTE);
                createParticle('solvent', config.solventCount, config.solventSize, config.temperature, COLORS.SOLVENT);
                particlesRef.current = particles;
                prevTempRef.current = config.temperature;
            }, [config.soluteCount, config.solventCount, config.soluteSize, config.solventSize, config.temperature]);

            useEffect(() => {
                const particles = particlesRef.current;
                particles.forEach(p => {
                    if (p.type === 'solute') {
                        p.radius = config.soluteSize;
                        p.mass = config.soluteSize * config.soluteSize;
                    } else {
                        p.radius = config.solventSize;
                        p.mass = config.solventSize * config.solventSize;
                    }
                });
            }, [config.soluteSize, config.solventSize]);

            useEffect(() => {
                if (prevTempRef.current === 0) { prevTempRef.current = config.temperature; return; }
                const ratio = config.temperature / prevTempRef.current;
                if (Math.abs(ratio - 1) > 0.01 && particlesRef.current.length > 0) {
                    particlesRef.current.forEach(p => { p.vx *= ratio; p.vy *= ratio; });
                }
                prevTempRef.current = config.temperature;
            }, [config.temperature]);

            useEffect(() => { initParticles(); }, [initParticles]);

            const animate = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                const width = canvas.width;
                const height = canvas.height;
                const particles = particlesRef.current;

                ctx.clearRect(0, 0, width, height);

                if (isPlaying) {
                    for (let i = 0; i < particles.length; i++) {
                        const p1 = particles[i];
                        p1.x += p1.vx; p1.y += p1.vy;
                        if (p1.x - p1.radius < 0) { p1.x = p1.radius; p1.vx *= -1; } 
                        else if (p1.x + p1.radius > width) { p1.x = width - p1.radius; p1.vx *= -1; }
                        if (p1.y - p1.radius < 0) { p1.y = p1.radius; p1.vy *= -1; } 
                        else if (p1.y + p1.radius > height) { p1.y = height - p1.radius; p1.vy *= -1; }

                        if (p1.type === 'solute' && config.showTrails) {
                            p1.history.push({ x: p1.x, y: p1.y });
                            if (p1.history.length > config.trailLength) p1.history.shift();
                        } else if (!config.showTrails) p1.history = [];

                        for (let j = i + 1; j < particles.length; j++) {
                            const p2 = particles[j];
                            const dx = p2.x - p1.x;
                            const dy = p2.y - p1.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            const minDist = p1.radius + p2.radius;

                            if (distance < minDist) {
                                const overlap = minDist - distance;
                                const nx = dx / distance;
                                const ny = dy / distance;
                                const totalMass = p1.mass + p2.mass;
                                p1.x -= nx * overlap * (p2.mass / totalMass);
                                p1.y -= ny * overlap * (p2.mass / totalMass);
                                p2.x += nx * overlap * (p1.mass / totalMass);
                                p2.y += ny * overlap * (p1.mass / totalMass);

                                const dvx = p2.vx - p1.vx;
                                const dvy = p2.vy - p1.vy;
                                const velAlongNormal = dvx * nx + dvy * ny;
                                if (velAlongNormal > 0) continue;

                                let jScalar = -(1 + PHYSICS.DAMPING) * velAlongNormal;
                                jScalar /= (1 / p1.mass + 1 / p2.mass);
                                const impulseX = jScalar * nx;
                                const impulseY = jScalar * ny;
                                p1.vx -= (1 / p1.mass) * impulseX;
                                p1.vy -= (1 / p1.mass) * impulseY;
                                p2.vx += (1 / p2.mass) * impulseX;
                                p2.vy += (1 / p2.mass) * impulseY;
                            }
                        }
                    }
                }

                particles.forEach(p => {
                    if (p.type === 'solute' && config.showTrails && p.history.length > 1) {
                        ctx.beginPath();
                        ctx.moveTo(p.history[0].x, p.history[0].y);
                        for (let k = 1; k < p.history.length; k++) ctx.lineTo(p.history[k].x, p.history[k].y);
                        ctx.strokeStyle = COLORS.TRAIL;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    if (p.type === 'solute') {
                        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                });
                requestRef.current = requestAnimationFrame(animate);
            }, [config.showTrails, config.trailLength, isPlaying]);

            useEffect(() => { requestRef.current = requestAnimationFrame(animate); return () => cancelAnimationFrame(requestRef.current); }, [animate]);

            useEffect(() => {
                const handleResize = () => {
                    if (containerRef.current && canvasRef.current) {
                        const { width, height } = containerRef.current.getBoundingClientRect();
                        const dpr = window.devicePixelRatio || 1;
                        canvasRef.current.width = width * dpr;
                        canvasRef.current.height = height * dpr;
                        const ctx = canvasRef.current.getContext('2d');
                        if (ctx) ctx.scale(dpr, dpr);
                        canvasRef.current.style.width = `${width}px`;
                        canvasRef.current.style.height = `${height}px`;
                        canvasRef.current.width = width;
                        canvasRef.current.height = height;
                        initParticles();
                    }
                };
                window.addEventListener('resize', handleResize);
                handleResize();
                return () => window.removeEventListener('resize', handleResize);
            }, [initParticles]);

            return (
                <div ref={containerRef} className="w-full h-[600px] bg-gray-900 rounded-xl border border-gray-700 overflow-hidden relative shadow-inner">
                    <canvas ref={canvasRef} className="block w-full h-full" />
                    {!isPlaying && (
                        <div className="absolute inset-0 bg-black/20 backdrop-blur-[1px] flex items-center justify-center pointer-events-none">
                            <div className="bg-black/60 px-4 py-2 rounded-full text-white font-bold backdrop-blur-md flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                  <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd" />
                                </svg>
                                已暫停
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [config, setConfig] = useState(DEFAULT_CONFIG);
            const [records, setRecords] = useState([]);
            const [isPlaying, setIsPlaying] = useState(true);

            const handleReset = () => { setConfig(DEFAULT_CONFIG); setIsPlaying(true); };
            const handleRecord = () => {
                const now = new Date();
                const timeString = now.toLocaleTimeString('zh-TW', { hour12: false });
                const newRecord = { ...config, id: crypto.randomUUID(), timestamp: timeString };
                setRecords((prev) => [...prev, newRecord]);
            };
            const handleClearRecords = () => { if (window.confirm('確定要清除所有紀錄嗎？')) setRecords([]); };
            const handleTogglePause = () => { setIsPlaying((prev) => !prev); };

            return (
                <div className="min-h-screen bg-gray-900 text-white font-sans selection:bg-orange-500 selection:text-white">
                    <header className="border-b border-gray-800 bg-gray-900/50 backdrop-blur-sm sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-orange-400 to-red-500 flex items-center justify-center shadow-lg shadow-orange-500/20">
                                    <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                                    </svg>
                                </div>
                                <h1 className="text-xl font-bold tracking-tight text-gray-100">
                                    布朗運動模擬 <span className="text-gray-500 font-normal text-sm hidden sm:inline-block">| Brownian Motion Simulator</span>
                                </h1>
                            </div>
                            <a href="https://en.wikipedia.org/wiki/Brownian_motion" target="_blank" rel="noreferrer" className="text-gray-400 hover:text-white text-sm transition-colors">
                                關於布朗運動 &rarr;
                            </a>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2 space-y-4">
                                <SimulationCanvas config={config} isPlaying={isPlaying} />
                                <div className="bg-gray-800/50 p-4 rounded-lg text-sm text-gray-400 leading-relaxed border border-gray-800">
                                    <h3 className="font-semibold text-gray-200 mb-1">觀察重點：</h3>
                                    <ul className="list-disc list-inside space-y-1">
                                        <li>觀察<span className="text-orange-400 font-bold">橘色大粒子 (溶質)</span> 如何被<span className="text-blue-400 font-bold">藍色小粒子 (溶劑)</span> 撞擊而產生不規則運動。</li>
                                        <li>試著調整<span className="text-white font-bold">溫度</span>，觀察粒子<span className="text-white font-bold">移動速度</span>的變化如何影響碰撞劇烈程度。</li>
                                    </ul>
                                </div>
                                <DataLogger records={records} onClear={handleClearRecords} />
                            </div>
                            <div className="lg:col-span-1">
                                <ControlPanel config={config} setConfig={setConfig} onReset={handleReset} onRecord={handleRecord} isPlaying={isPlaying} onTogglePause={handleTogglePause} />
                                <div className="mt-6 p-4 rounded-xl bg-blue-900/20 border border-blue-800/50">
                                    <h3 className="text-blue-200 font-bold mb-2 flex items-center gap-2">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                        科學原理
                                    </h3>
                                    <p className="text-blue-100/80 text-sm">
                                        布朗運動（Brownian motion）是指微小粒子在流體中進行的無規則運動。這是由於流體分子（溶劑）對懸浮粒子（溶質）進行頻繁且不均勻的碰撞所致。
                                    </p>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
